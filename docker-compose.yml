# docker-compose.yml
# Spec: BUILD.md §107 (revised in v1.1).
#
# `docker compose up` starts the FIVE-container core only. It boots in seconds
# on a laptop.
#
# The observability and full stacks are one flag away:
#   docker compose --profile observability up
#   docker compose --profile full up
#
# Absent by design (see §36.4 and §68.4 for their graduation triggers):
#   rabbitmq  -> River runs jobs inside Postgres
#   vault     -> SOPS + age
#
# v1.0 put twelve containers in the default path, which meant every developer
# paid several GB of RAM and a slow start on every run to exercise
# infrastructure Phase 1 does not use.

name: netcore

services:
  # ---------------------------------------------------------------- CORE ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netcore
      POSTGRES_PASSWORD: netcore_dev_only
      POSTGRES_DB: netcore
      # Deterministic collation: index ordering must not vary by host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=200ms   # surface slow queries in dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netcore -d netcore"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly so rate-limit and OTP state survives a restart; §82.2a
    # explains why losing it degrades onboarding.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  freeradius:
    image: freeradius/freeradius-server:3.2-alpine
    # §106: FreeRADIUS configuration is production configuration and lives in
    # version control. Hand-edited files on a server are not reproducible.
    volumes:
      - ./freeradius:/etc/raddb/local:ro
    ports:
      - "1812:1812/udp"   # authentication
      - "1813:1813/udp"   # accounting
      - "3799:3799/udp"   # CoA / Disconnect (§25)
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      NETCORE_ENV: development
      NETCORE_HTTP_ADDR: ":8080"
      NETCORE_DB_DSN: "postgres://netcore:netcore_dev_only@postgres:5432/netcore?sslmode=disable"
      NETCORE_REDIS_ADDR: "redis:6379"
      NETCORE_ALLOWED_ORIGINS: "http://localhost:3000"
      NETCORE_SECRETS_BACKEND: sops
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # §72: read-only root filesystem, all capabilities dropped.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    build: {context: ., dockerfile: Dockerfile}
    entrypoint: ["/worker"]
    environment:
      NETCORE_ENV: development
      NETCORE_SERVICE_NAME: netcore-worker
      NETCORE_DB_DSN: "postgres://netcore:netcore_dev_only@postgres:5432/netcore?sslmode=disable"
      NETCORE_REDIS_ADDR: "redis:6379"
      NETCORE_SECRETS_BACKEND: sops
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # ------------------------------------------------- PROFILE: observability --
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability", "full"]
    volumes:
      - ./deployments/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability", "full"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: dev_only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3001:3000"]
    depends_on: [prometheus]

  loki:
    image: grafana/loki:latest
    profiles: ["observability", "full"]
    ports: ["3100:3100"]

  tempo:
    image: grafana/tempo:latest
    profiles: ["observability", "full"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deployments/compose/tempo.yaml:/etc/tempo.yaml:ro

  # ----------------------------------------------------------- PROFILE: full --
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["full"]
    ports: ["8025:8025", "1025:1025"]

  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: netcore
      MINIO_ROOT_PASSWORD: netcore_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  redisdata:
  miniodata:
